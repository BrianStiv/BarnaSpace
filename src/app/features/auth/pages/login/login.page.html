<div class="min-h-screen bg-cream py-10 sm:py-16 flex flex-col justify-center">
  <div class="max-w-md w-full mx-auto px-4 sm:px-6">
    
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-gray-100">
      
      <div class="text-center mb-8">
        <span class="inline-block px-3.5 py-1 rounded-full bg-terracota/10 text-terracota text-xs font-bold uppercase tracking-wider mb-2">
          Bienvenido de nuevo
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-dark tracking-tight">Iniciar sesión</h1>
        <p class="text-xs sm:text-sm text-gray-500 font-medium mt-1">Accede a tu cuenta para gestionar tus espacios y reservas</p>
      </div>

      <app-login-form (login)="onLogin($event)" />

      <div class="relative my-6 flex items-center justify-center">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-100"></div>
        </div>
        <span class="relative bg-white px-3 text-xs font-bold uppercase tracking-wider text-gray-400">
          o continúa con
        </span>
      </div>

      <button
        type="button"
        (click)="onGoogleLogin()"
        class="w-full flex items-center justify-center gap-2.5 bg-gray-50/80 hover:bg-gray-100/80 border border-gray-200/80 rounded-2xl py-3 px-4 font-bold text-sm text-dark shadow-2xs hover:shadow-sm transition-all active:scale-95 cursor-pointer">
        <mat-icon class="!text-xl text-terracota">account_circle</mat-icon>
        <span>Continuar con Google</span>
      </button>

      <p class="text-center mt-6 pt-4 border-t border-gray-100 text-xs sm:text-sm font-semibold text-gray-500">
        ¿No tienes cuenta?
        <a 
          routerLink="/auth/register" 
          class="text-terracota font-extrabold hover:underline transition-all ml-1 inline-block">
          Regístrate gratis
        </a>
      </p>

    </div>

  </div>
</div>
