<div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 mb-10">
  @for (category of categories; track category.id) {
    <button
      type="button"
      (click)="selectCategory(category.id)"
      class="flex flex-col items-center gap-3 bg-transparent border-none p-0 cursor-pointer group focus:outline-none active:scale-95 transition-transform">

      <div
        class="w-full aspect-square rounded-3xl overflow-hidden transition-all duration-300 shadow-md group-hover:shadow-xl relative border border-gray-100"
        [class.scale-105]="selectedCategory() === category.id"
        [class.ring-4]="selectedCategory() === category.id"
        [class.ring-mustard]="selectedCategory() === category.id"
        [class.shadow-xl]="selectedCategory() === category.id">
        
        <img
          [src]="category.image"
          [alt]="category.label"
          class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
        
        <div class="absolute inset-0 bg-gradient-to-t from-dark/20 via-transparent to-transparent opacity-60"></div>
      </div>

      <span 
        class="text-sm sm:text-base font-extrabold tracking-tight transition-colors duration-200"
        [class.text-terracota]="selectedCategory() === category.id"
        [class.text-dark]="selectedCategory() !== category.id"
        [class.group-hover:text-terracota]="selectedCategory() !== category.id">
        {{ category.label }}
      </span>
    </button>
  }
</div>

<div class="bg-white p-2.5 sm:p-3.5 rounded-3xl sm:rounded-full shadow-xl border border-gray-100 max-w-4xl mx-auto transition-all">
  <div class="flex flex-col md:flex-row items-center justify-between gap-1 md:gap-0">

    <div class="relative w-full md:w-1/3 px-4 py-2.5 rounded-2xl md:rounded-full hover:bg-gray-50/80 transition-colors focus-within:bg-gray-50/80 group">
      <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 group-focus-within:text-terracota transition-colors mb-0.5">
        ¿Dónde?
      </label>
      <div class="flex items-center gap-2">
        <input 
          type="text"
          [ngModel]="neighborhood()" 
          (ngModelChange)="neighborhood.set($event)" 
          placeholder="Barrio de Barcelona"
          class="w-full bg-transparent text-sm font-semibold text-dark placeholder-gray-400 outline-none border-none p-0 focus:ring-0" />
        <mat-icon class="!text-lg text-terracota shrink-0">location_on</mat-icon>
      </div>
    </div>

    <div class="hidden md:block w-px h-8 bg-gray-100"></div>

    <div class="relative w-full md:w-1/3 px-4 py-2.5 rounded-2xl md:rounded-full hover:bg-gray-50/80 transition-colors focus-within:bg-gray-50/80 group">
      <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 group-focus-within:text-terracota transition-colors mb-0.5">
        ¿Cuándo?
      </label>
      <div class="flex items-center gap-2">
        <input 
          type="date" 
          [ngModel]="when()" 
          (ngModelChange)="when.set($event)"
          class="w-full bg-transparent text-sm font-semibold text-dark outline-none border-none p-0 focus:ring-0 cursor-pointer text-xs sm:text-sm" />
      </div>
    </div>

    <div class="hidden md:block w-px h-8 bg-gray-100"></div>

    <div class="relative w-full md:w-1/3 px-4 py-2.5 rounded-2xl md:rounded-full hover:bg-gray-50/80 transition-colors focus-within:bg-gray-50/80 group">
      <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 group-focus-within:text-terracota transition-colors mb-0.5">
        ¿Cuántos?
      </label>
      <div class="flex items-center gap-2">
        <input 
          type="number" 
          min="1"
          [ngModel]="guests()" 
          (ngModelChange)="guests.set($event)" 
          placeholder="Invitados"
          class="w-full bg-transparent text-sm font-semibold text-dark placeholder-gray-400 outline-none border-none p-0 focus:ring-0" />
        <mat-icon class="!text-lg text-terracota shrink-0">group</mat-icon>
      </div>
    </div>

    <div class="w-full md:w-auto flex justify-center pt-2 md:pt-0 md:pl-2">
      <button
        type="button"
        aria-label="Buscar espacios"
        (click)="searchSpaces()"
        class="flex items-center justify-center w-full md:w-12 h-12 rounded-2xl md:rounded-full bg-terracota hover:bg-terracota/90 text-white shrink-0 shadow-md hover:shadow-lg transition-all active:scale-95 cursor-pointer">
        <mat-icon class="!text-xl" aria-hidden="true">search</mat-icon>
        <span class="md:hidden ml-2 font-bold text-sm">Buscar espacios</span>
      </button>
    </div>

  </div>
</div>
