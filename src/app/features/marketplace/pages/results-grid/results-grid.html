<div class="min-h-screen bg-cream py-8 md:py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">

    <div class="flex items-center gap-4 mb-8">
      <button 
        type="button"
        (click)="router.navigate(['/marketplace'])"
        aria-label="Volver al marketplace"
        class="w-10 h-10 rounded-full bg-white border border-gray-100 shadow-sm flex items-center justify-center text-dark hover:bg-terracota hover:text-white hover:border-terracota transition-all active:scale-95 cursor-pointer">
        <mat-icon class="!text-xl">arrow_back</mat-icon>
      </button>

      <div>
        <span class="inline-block px-3 py-0.5 rounded-full bg-terracota/10 text-terracota text-[11px] font-bold uppercase tracking-wider mb-1">
          Búsqueda
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-dark tracking-tight">Resultados de espacios</h1>
      </div>
    </div>

    @if (spaces(); as list) {
      @if (list.length > 0) {
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          @for (space of list; track space.id) {
            <app-space-card [space]="space" (click)="goToDetail(space)" />
          }
        </div>
      } @else {
        <div class="py-12 max-w-lg mx-auto">
          <app-empty-state
            title="No hay espacios disponibles"
            message="Prueba a cambiar los filtros o ampliar tu búsqueda para encontrar otras opciones."
            icon="search_off" />
        </div>
      }
    } @else {
      <div class="flex flex-col items-center justify-center py-24 gap-4">
        <mat-spinner diameter="40" color="primary" />
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Cargando espacios...</p>
      </div>
    }

  </div>
</div>
