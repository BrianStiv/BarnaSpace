<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
  @for (field of simpleFields; track field.name) {
  <app-dynamic-field [field]="field" [form]="form" />
  }

  <app-address-input [address]="form.value.address" (addressChange)="form.patchValue({ address: $event })" />

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Código postal</mat-label>
    <input matInput type="text" formControlName="zipCode" placeholder="08013" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Ciudad</mat-label>
    <input matInput type="text" formControlName="city" placeholder="Barcelona" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Barrio (opcional)</mat-label>
    <input matInput type="text" formControlName="neighborhood" placeholder="Gràcia" />
  </mat-form-field>

  <div>
    <p class="text-sm text-medium mb-2">Categorías</p>
    <div class="flex flex-wrap gap-2">
      @for (category of categories; track category) {
      <button type="button" (click)="toggleCategory(category)"
        class="px-3 py-1 rounded-full text-sm border-2 transition-colors"
        [class.border-terracota]="isSelected(category, 'categories')"
        [class.bg-terracota]="isSelected(category, 'categories')"
        [class.text-white]="isSelected(category, 'categories')"
        [class.border-light]="!isSelected(category, 'categories')">
        {{ category }}
      </button>
      }
    </div>
  </div>

  <div>
    <p class="text-sm text-medium mb-2">Amenities</p>
    <div class="flex flex-wrap gap-2">
      @for (amenity of amenities; track amenity) {
      <button type="button" (click)="toggleAmenity(amenity)"
        class="px-3 py-1 rounded-full text-sm border-2 transition-colors"
        [class.border-forest]="isSelected(amenity, 'amenities')" [class.bg-forest]="isSelected(amenity, 'amenities')"
        [class.text-white]="isSelected(amenity, 'amenities')" [class.border-light]="!isSelected(amenity, 'amenities')">
        {{ amenity }}
      </button>
      }
    </div>
  </div>

  <app-image-url-input [images]="form.value.images" (imagesChange)="form.patchValue({ images: $event })" />

  <div class="flex gap-3 pt-4">
    <button type="button" mat-stroked-button class="flex-1" (click)="cancel.emit()">
      Cancelar
    </button>

    <button type="submit" mat-flat-button class="flex-1 !bg-terracota !text-white" [disabled]="form.invalid">
      {{ submitLabel() }}
    </button>
  </div>
</form>
