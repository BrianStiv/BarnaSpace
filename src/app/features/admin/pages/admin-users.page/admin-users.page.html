<div class="bg-cream py-6">
  <div class="max-w-7xl mx-auto">

    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-dark">Gestión de usuarios</h1>
    </div>


    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <mat-form-field appearance="outline" class="flex-1">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          type="search"
          placeholder="Buscar por nombre o email"
          [value]="search()"
          (input)="search.set($any($event.target).value)" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full md:w-48">
        <mat-select
          [value]="roleFilter()"
          (selectionChange)="roleFilter.set($event.value)">
          <mat-option value="all">Todos los roles</mat-option>
          <mat-option value="client">Clientes</mat-option>
          <mat-option value="host">Hosts</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
      <mat-card class="lg:col-span-3">
        <mat-card-content>
          @if (usersResource.isLoading()) {
            <div class="flex justify-center py-8">
              <mat-spinner diameter="40" />
            </div>
          } @else {
            <app-admin-table
              [columns]="userColumns"
              [data]="filteredUsers()"
              [loading]="usersResource.isLoading()"
              (rowClick)="onRowSelect($event)" />
          }
        </mat-card-content>
      </mat-card>

      <div class="lg:col-span-2">
        <app-admin-detail-panel
          [sections]="userSections()"
          emptyMessage="Selecciona un usuario para ver el detalle" />
      </div>
    </div>

  </div>
</div>
