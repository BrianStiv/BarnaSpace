<div class="min-h-screen bg-cream py-8 md:py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">

    <div class="mb-8">
      <span class="inline-block px-3.5 py-1 rounded-full bg-terracota/10 text-terracota text-xs font-bold uppercase tracking-wider mb-2">
        Administración
      </span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-dark tracking-tight">Gestión de usuarios</h1>
      <p class="text-medium text-sm sm:text-base mt-1">Consulta y administra la información de clientes y anfitriones registrados.</p>
    </div>

    <div class="flex flex-col md:flex-row gap-4 mb-6">
      
      <div class="flex-1 relative flex items-center bg-white rounded-2xl border border-gray-100 shadow-sm focus-within:border-terracota focus-within:ring-2 focus-within:ring-terracota/20 transition-all px-4 py-3">
        <mat-icon class="!text-xl text-gray-400 shrink-0 mr-2.5">search</mat-icon>
        <input
          type="search"
          placeholder="Buscar por nombre o email..."
          [value]="search()"
          (input)="search.set($any($event.target).value)"
          class="w-full bg-transparent text-sm font-semibold text-dark placeholder-gray-400 outline-none border-none p-0 focus:ring-0" />
      </div>

      <div class="w-full md:w-56 relative flex items-center bg-white rounded-2xl border border-gray-100 shadow-sm focus-within:border-terracota focus-within:ring-2 focus-within:ring-terracota/20 transition-all px-4 py-3">
        <mat-icon class="!text-xl text-gray-400 shrink-0 mr-2">filter_list</mat-icon>
        <select
          [value]="roleFilter()"
          (change)="roleFilter.set($any($event.target).value)"
          class="w-full bg-transparent text-sm font-semibold text-dark outline-none border-none p-0 focus:ring-0 appearance-none cursor-pointer pr-6">
          <option value="all">Todos los roles</option>
          <option value="client">Clientes</option>
          <option value="host">Hosts</option>
        </select>
        <mat-icon class="!text-lg text-gray-400 shrink-0 pointer-events-none absolute right-4">expand_more</mat-icon>
      </div>

    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
      
      <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-lg border border-gray-100 flex flex-col justify-between">
        <div>
          <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
            <mat-icon class="!text-xl text-terracota">people_alt</mat-icon>
            <h2 class="text-lg font-extrabold text-dark">Listado de usuarios</h2>
          </div>

          @if (usersResource.isLoading()) {
            <div class="flex justify-center py-16">
              <mat-spinner diameter="40" color="primary" />
            </div>
          } @else {
            <div class="overflow-hidden pt-2">
              <app-admin-table
                [columns]="userColumns"
                [data]="filteredUsers()"
                [loading]="usersResource.isLoading()"
                (rowClick)="onRowSelect($event)" />
            </div>
          }
        </div>
      </div>

      <div class="lg:col-span-2">
        <app-admin-detail-panel
          [sections]="userSections()"
          emptyMessage="Selecciona un usuario para ver el detalle" />
      </div>

    </div>

  </div>
</div>
