<div class="min-h-screen bg-cream py-8 md:py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">

    <div class="mb-8">
      <span class="inline-block px-3.5 py-1 rounded-full bg-terracota/10 text-terracota text-xs font-bold uppercase tracking-wider mb-2">
        Administración
      </span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-dark tracking-tight">Reservas</h1>
      <p class="text-medium text-sm sm:text-base mt-1">Supervisa y gestiona las reservas de la plataforma según su estado.</p>
    </div>

    <div class="bg-white p-1.5 rounded-2xl sm:rounded-full shadow-sm border border-gray-100 flex flex-wrap sm:flex-nowrap gap-1 mb-8">
      @for (label of ['Pendientes', 'Confirmadas', 'Rechazadas', 'Canceladas']; track $index) {
        <button
          type="button"
          (click)="onTabChange($index)"
          class="flex-1 py-2.5 px-4 rounded-xl sm:rounded-full text-xs sm:text-sm font-bold transition-all text-center active:scale-95 cursor-pointer"
          [class.bg-terracota]="activeStatus() === tabStatuses[$index]"
          [class.text-white]="activeStatus() === tabStatuses[$index]"
          [class.shadow-md]="activeStatus() === tabStatuses[$index]"
          [class.text-gray-500]="activeStatus() !== tabStatuses[$index]"
          [class.hover:text-dark]="activeStatus() !== tabStatuses[$index]"
          [class.hover:bg-gray-50]="activeStatus() !== tabStatuses[$index]">
          {{ label }}
        </button>
      }
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

      <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-lg border border-gray-100 flex flex-col justify-between">
        <div>
          <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
            <mat-icon class="!text-xl text-terracota">event_available</mat-icon>
            <h2 class="text-lg font-extrabold text-dark">Listado de reservas</h2>
          </div>

          @if (bookingsResource.isLoading()) {
            <div class="flex justify-center py-16">
              <mat-spinner diameter="40" color="primary" />
            </div>
          } @else {
            <div class="overflow-hidden pt-2">
              <app-admin-table
                [columns]="bookingColumns"
                [data]="filteredBookings()"
                (rowClick)="onRowSelect($event)" />
            </div>
          }
        </div>
      </div>

      <div class="lg:col-span-2">
        <app-admin-detail-panel
          [sections]="detailSections()"
          emptyMessage="Selecciona una reserva para ver el detalle">
          
          <ng-template #actions>
            @if (canCancel()) {
              <div class="w-full pt-1">
                <button
                  type="button"
                  [disabled]="processing()"
                  (click)="onCancel()"
                  class="w-full py-3 px-4 rounded-2xl font-bold text-sm text-white bg-terracota hover:bg-terracota/90 disabled:opacity-50 shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                  
                  @if (processing()) {
                    <mat-spinner diameter="20" color="accent" />
                  } @else {
                    <mat-icon class="!text-lg">event_busy</mat-icon>
                    Anular reserva
                  }
                </button>
              </div>
            }
          </ng-template>

        </app-admin-detail-panel>
      </div>

    </div>

  </div>
</div>
