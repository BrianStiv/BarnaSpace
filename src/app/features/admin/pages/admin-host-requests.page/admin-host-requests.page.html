<div class="min-h-screen bg-cream py-8 md:py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">

    <div class="mb-8">
      <span class="inline-block px-3.5 py-1 rounded-full bg-terracota/10 text-terracota text-xs font-bold uppercase tracking-wider mb-2">
        Administración
      </span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-dark tracking-tight">Solicitudes de anfitrión</h1>
      <p class="text-medium text-sm sm:text-base mt-1">Revisa y gestiona las peticiones de los usuarios para convertirse en anfitriones.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

      <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-lg border border-gray-100 flex flex-col justify-between">
        <div>
          <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
            <mat-icon class="!text-xl text-terracota">badge</mat-icon>
            <h2 class="text-lg font-extrabold text-dark">Listado de solicitudes</h2>
          </div>

          @if (requestsResource.isLoading()) {
            <div class="flex justify-center py-16">
              <mat-spinner diameter="40" color="primary" />
            </div>
          } @else {
            <div class="overflow-hidden pt-2">
              <app-admin-table
                [columns]="requestColumns"
                [data]="requestsResource.value() ?? []"
                [loading]="requestsResource.isLoading()"
                (rowClick)="onRowSelect($event)" />
            </div>
          }
        </div>
      </div>

      <div class="lg:col-span-2">
        <app-admin-detail-panel
          [sections]="detailSections()"
          emptyMessage="Selecciona una solicitud para ver el detalle">
          
          <ng-template #actions>
            @if (selectedUser()) {
              <div class="flex flex-col gap-4 w-full">
                
                <div class="space-y-1 w-full">
                  <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">
                    Motivo de rechazo <span class="text-gray-400 font-normal lowercase">(opcional)</span>
                  </label>
                  <div class="relative flex items-center bg-gray-50/80 rounded-2xl border border-gray-200 focus-within:border-terracota focus-within:bg-white focus-within:ring-2 focus-within:ring-terracota/20 transition-all px-4 py-2.5">
                    <input
                      type="text"
                      [(ngModel)]="rejectionReason"
                      placeholder="Indica el motivo si vas a rechazar..."
                      class="w-full bg-transparent text-sm font-semibold text-dark placeholder-gray-400 outline-none border-none p-0 focus:ring-0" />
                  </div>
                </div>

                <div class="flex items-center gap-3 pt-2">
                  <button
                    type="button"
                    [disabled]="processing()"
                    (click)="onApprove()"
                    class="flex-1 py-3 px-4 rounded-2xl font-bold text-sm text-white bg-forest hover:bg-forest/90 disabled:opacity-50 shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                    @if (processing()) {
                      <mat-spinner diameter="20" color="accent" />
                    } @else {
                      <mat-icon class="!text-lg">check_circle</mat-icon>
                      Aprobar
                    }
                  </button>

                  <button
                    type="button"
                    [disabled]="processing()"
                    (click)="onReject()"
                    class="flex-1 py-3 px-4 rounded-2xl font-bold text-sm text-white bg-terracota hover:bg-terracota/90 disabled:opacity-50 shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                    @if (processing()) {
                      <mat-spinner diameter="20" color="accent" />
                    } @else {
                      <mat-icon class="!text-lg">cancel</mat-icon>
                      Rechazar
                    }
                  </button>
                </div>

              </div>
            }
          </ng-template>

        </app-admin-detail-panel>
      </div>

    </div>

  </div>
</div>
