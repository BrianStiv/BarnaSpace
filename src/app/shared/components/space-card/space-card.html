<article class="group cursor-pointer rounded-2xl overflow-hidden bg-white shadow-sm hover:shadow-md transition-shadow">
  <div class="relative aspect-[4/3] overflow-hidden">
    <img
      [src]="space().images[0] || 'https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=800&q=80'"
      [alt]="space().name"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
    />
    <button
      type="button"
      (click)="$event.stopPropagation(); favoriteClick.emit()"
      class="absolute top-3 right-3 p-2 rounded-full bg-white/80 hover:bg-white transition-colors"
      [attr.aria-label]="isFavorite() ? 'Quitar de favoritos' : 'Añadir a favoritos'"
    >
      <mat-icon class="text-2xl">
        {{ isFavorite() ? 'favorite' : 'favorite_border' }}
      </mat-icon>
    </button>
  </div>

  <div class="p-4">
    <h3 class="font-semibold text-lg text-dark leading-tight">
      {{ space().name }}
    </h3>
    <p class="text-medium text-sm mt-1">
      {{ space().location.neighborhood }}
    </p>

    <div class="flex items-center gap-4 text-medium text-sm mt-2">
      <span class="flex items-center gap-1">
        <mat-icon>group</mat-icon>
        {{ space().capacity }}
      </span>
      <span class="flex items-center gap-1">
        <mat-icon>square_foot</mat-icon>
        {{ space().squareMeters }} m²
      </span>
    </div>

    <div class="flex items-center justify-between mt-3">
      <p class="text-terracota font-bold text-lg">
        {{ space().dailyPrice | currency: 'EUR' }}<span class="text-sm font-normal text-medium">/día</span>
      </p>
      @if (space().amenities.includes('pet_friendly')) {
        <span class="text-xs bg-forest/10 text-forest px-2 py-1 rounded-full">
          Pet Friendly
        </span>
      }
    </div>
  </div>
</article>
