<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');

      .brand-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      
      .barna {
        font-weight: 800;
        fill: #2C2C2C;
        font-size: 76px;
        letter-spacing: -1.5px;
      }

      .space {
        font-weight: 400;
        fill: #E8A838;
        font-size: 76px;
        letter-spacing: -1px;
      }

      .slogan {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 500;
        fill: #2C2C2C;
        font-size: 19px;
        letter-spacing: 3.5px;
      }
    </style>
  </defs>

  <g transform="translate(400, 135)" text-anchor="middle">
    <!-- Nombre de marca: Barna (Negrita #2C2C2C) + Space (Fino #E8A838) -->
    <text y="0" class="brand-text">
      <tspan class="barna">Barna</tspan><tspan class="space">Space</tspan>
    </text>
    
    <!-- Eslogan -->
    <text y="58" class="slogan">TU ESPACIO PARA TI EN MOMENTOS ESPECIALES</text>
  </g>
</svg>
